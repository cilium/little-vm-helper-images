name: buildx-step
on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      build-file:
        required: true
        type: string
      build-tag:
        required: true
        type: string
      check-files:
        required: true
        type: string
      base-ref:
        required: true
        type: string
      build-args:
        default: ''
        type: string
      dry-run:
        default: false
        type: boolean
      patch-cmd:
        type: string
      apply-patch:
        type: string
      apply-patch-2:
        type: string
      platforms:
        type: string
        required: false
      runner:
        type: string
        required: false
        default: 'oracle-vm-16cpu-64gb-x86-64'
jobs:
  build:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      # Required by the Quay OIDC token exchange.
      id-token: write
    # Pins the OIDC token subject to
    # repo:cilium/little-vm-helper-images:environment:publish-ci-images, which is the identity
    # federated with the Quay robot account.
    environment:
      name: publish-ci-images
      deployment: false
    steps:
      - name: Cleanup Disk space in runner
        uses: cilium/cilium/.github/actions/disk-cleanup@ba65a17fd0d0e28eab3c3c6062f76969ad2b4fc3 # main

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: init git repo
        run: |
          git config user.name "GH action"
          git config user.email "ghabot@does.not.exist.cilium.org"

      - name: Check if files were modified
        id: check
        run: |
         git fetch origin
         set +e
         git diff --quiet --exit-code origin/${{ inputs.base-ref }}..origin/${{ github.event.pull_request.head.ref }} ${{ inputs.check-files }}
         if [ $? -eq  0 ]; then
           echo "No changes, no need to rebuild"
           echo  "build=n" | tee -a $GITHUB_OUTPUT
         else
           echo "Need to rebuild"
           echo  "build=y" | tee -a $GITHUB_OUTPUT
         fi
         set -e

      - name: download first patch
        if: ${{ steps.check.outputs.build == 'y' && inputs.apply-patch != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
           name: ${{ inputs.apply-patch }}
           path: /tmp/
      - name: apply first patch
        if: ${{ steps.check.outputs.build == 'y' && inputs.apply-patch != '' }}
        run: |
          if [ $(wc -l < /tmp/${{ inputs.apply-patch }} ) -gt 0 ]; then
            cat /tmp/${{ inputs.apply-patch }}
            git am /tmp/${{ inputs.apply-patch }}
            git log --oneline -n 2
          fi

      - name: download second patch
        if: ${{ steps.check.outputs.build == 'y' && inputs.apply-patch-2 != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
           name: ${{ inputs.apply-patch-2 }}
           path: /tmp/
      - name: apply second patch
        if: ${{ steps.check.outputs.build == 'y' && inputs.apply-patch-2 != '' }}
        run: |
          if [ $(wc -l < /tmp/${{ inputs.apply-patch-2 }} ) -gt 0 ]; then
            cat /tmp/${{ inputs.apply-patch-2 }}
            git am /tmp/${{ inputs.apply-patch-2 }}
            git log --oneline -n 2
          fi

      - name: evaluate build args
        id: buildargs
        run: |
          {
            echo 'value<<EOF'
            echo -n "${{ inputs.build-args }}"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: setup buildx
        if: ${{ steps.check.outputs.build == 'y' && !inputs.dry-run }}
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # Quay's registry endpoint only accepts credentials or a JWT signed by
      # Quay itself, so the GitHub OIDC token cannot be used as the registry
      # password directly. Trade it for a short lived robot token first.
      #
      # Because the job references an environment, the subject of the token is
      # repo:cilium@21054566/little-vm-helper-images@515967269:environment:publish-ci-images,
      # the immutable form that carries the owner and repository ids. That is
      # the identity federated with the robot account on the Quay side, so
      # renaming the environment breaks the login.
      - name: Get a quay.io robot token via OIDC
        id: registry-token
        if: ${{ steps.check.outputs.build == 'y' && !inputs.dry-run }}
        env:
          ROBOT: ${{ vars.QUAY_ROBOT_CI }}
        run: |
          oidc_token="$(curl -sSf --retry 3 --retry-all-errors \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=quay.io" \
            | jq -er '.value')"
          echo "::add-mask::${oidc_token}"

          # Pass the credentials on stdin so that the OIDC token is not visible
          # in the process list of the runner.
          robot_token="$(printf 'user = "%s:%s"\n' "${ROBOT}" "${oidc_token}" \
            | curl -sSf --retry 3 --retry-all-errors -K - \
              "https://quay.io/oauth2/federation/robot/token" \
            | jq -er '.token')"
          echo "::add-mask::${robot_token}"

          echo "token=${robot_token}" >> "$GITHUB_OUTPUT"

      - name: quay login
        if: ${{ steps.check.outputs.build == 'y' && !inputs.dry-run }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ vars.QUAY_ROBOT_CI }}
          password: ${{ steps.registry-token.outputs.token }}
      - name: build and push
        if: ${{ steps.check.outputs.build == 'y' && !inputs.dry-run }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          no-cache: true
          file: ${{ inputs.build-file }}
          tags: ${{ inputs.build-tag }}
          build-args: ${{ steps.buildargs.outputs.value }}
          platforms: ${{ inputs.platforms }}
      - name: run commands and generate patches
        if: ${{ steps.check.outputs.build == 'y' && inputs.patch-cmd != '' }}
        run: |
            old=$(git rev-parse --abbrev-ref HEAD)
            git switch -c tmp-${{ inputs.name }}
            ${{ inputs.patch-cmd }}
            git add .
            git commit --all -m "TEMP: ${{ inputs.name }}"
            git format-patch -1 --stdout | tee ${{ inputs.name }}.patch
            git switch $old

      - name: generate empty patch
        if: ${{ steps.check.outputs.build != 'y' && inputs.patch-cmd != '' }}
        run: |
            truncate -s 0 ${{ inputs.name }}.patch

      - name: upload patch
        if: ${{ inputs.patch-cmd != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.name }}.patch
          path: ${{ inputs.name }}.patch
